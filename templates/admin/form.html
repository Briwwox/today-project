<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Праздник — админ-панель сегодня 🎉</title>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
  {% set back_q = request.args.get('q', '') %}
  <div class="wrap-sm">
    <div class="topbar topbar--compact">
      <h2 class="topbar__title">Редактирование</h2>
      <div class="nav-actions">
        <button type="button" id="themeToggle" class="theme-toggle" title="Переключить тему" aria-label="Переключить тему">
          <span class="toggle-icon sun">☀️</span>
          <span class="toggle-icon moon">🌙</span>
          <span class="toggle-thumb"></span>
        </button>
        <a href="{{ url_for('admin.admin_dashboard', q=back_q) if back_q else url_for('admin.admin_dashboard') }}" class="btn btn-ghost">← Назад</a>
      </div>
    </div>

    <div class="card">
      <h1>{{ title_text }}</h1>

      <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label for="holidayTitleInput">НАЗВАНИЕ ПРАЗДНИКА</label>
          <input id="holidayTitleInput" type="text" name="title" maxlength="150" required value="{{ holiday.title if holiday else '' }}" placeholder="Например: День хорошего настроения">
        </div>

        <div class="form-group">
          <label for="datePicker">ДАТА ПОКАЗА (выберите день в календаре)</label>
          <div class="date-picker-row">
            <input type="date" id="datePicker" class="flex-1">
            <input type="text" name="show_date" id="showDateInput" readonly aria-label="Дата показа в формате ММ-ДД" value="{{ holiday.show_date if holiday else '' }}" placeholder="ММ-ДД" class="date-readonly">
            <button type="button" id="clearDateBtn" title="Очистить дату" aria-label="Очистить дату" class="btn-clear-date">✕</button>
          </div>
        </div>

        <div class="form-group">
          <label for="holidayEmojiInput">ЭМОДЗИ (иконка)</label>
          <input id="holidayEmojiInput" type="text" name="emoji" maxlength="16" required value="{{ holiday.emoji if holiday else '🎉' }}" placeholder="😊">
        </div>

        <div class="form-group">
          <label for="holidayTintInput">ЦВЕТОВОЙ ФОН (tint)</label>
          <input id="holidayTintInput" type="color" name="tint" required value="{{ holiday.tint if holiday else '#f8dfe3' }}">
        </div>

        <div class="form-group">
          <label for="holidayDescriptionInput">ОПИСАНИЕ</label>
          <textarea id="holidayDescriptionInput" name="description" maxlength="1500" required placeholder="Пара предложений о празднике...">{{ holiday.description if holiday else '' }}</textarea>
        </div>

        <div class="form-group">
          <label for="holidayMissionInput">МИССИЯ НА СЕГОДНЯ</label>
          <input id="holidayMissionInput" type="text" name="mission" maxlength="300" value="{{ holiday.mission if holiday else '' }}" placeholder="Что нужно сделать сегодня?">
        </div>

        <div class="form-group">
          <label for="holidayTypeSelect">ТИП ПРАЗДНИКА</label>
          <select id="holidayTypeSelect" name="type" required>
            <option value="author" {% if not holiday or holiday.type == 'author' %}selected{% endif %}>✍️ Авторский</option>
            <option value="unusual" {% if holiday and holiday.type == 'unusual' %}selected{% endif %}>🎈 Необычный (существующий)</option>
            <option value="official" {% if holiday and holiday.type == 'official' %}selected{% endif %}>📅 Официальный</option>
          </select>
        </div>

        <div class="form-group">
          <label for="holidayFactInput">ИНТЕРЕСНЫЙ ФАКТ (необязательно)</label>
          <textarea id="holidayFactInput" name="fact" maxlength="600" placeholder="Короткий факт о празднике...">{{ holiday.fact if holiday else '' }}</textarea>
        </div>

        <div class="form-group">
          <label for="holidayTagsInput">ТЕГИ (через запятую, для будущих коллекций)</label>
          <input id="holidayTagsInput" type="text" name="tags" maxlength="250" value="{{ holiday.tags if holiday else '' }}" placeholder="animals, winter, cozy">
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" name="active" id="active" {% if not holiday or holiday.active == 1 %}checked{% endif %}>
          <label for="active" class="checkbox-label">Праздник активен (участвует в ротации)</label>
        </div>

        <div class="btn-container">
          <button type="submit" class="btn">Сохранить</button>
          <a href="{{ url_for('admin.admin_dashboard', q=back_q) if back_q else url_for('admin.admin_dashboard') }}" class="btn btn-ghost">Отмена</a>
        </div>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/form.js') }}"></script>
</body>
</html>
