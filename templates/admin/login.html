<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход в админку — сегодня 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="auth-theme-bar">
    <button type="button" id="themeToggle" class="theme-toggle theme-toggle-compact" title="Переключить тему" aria-label="Переключить тему">
      <span class="toggle-icon sun">☀️</span>
      <span class="toggle-icon moon">🌙</span>
      <span class="toggle-thumb"></span>
    </button>
  </div>

  <main class="login-card">
    <h1>Вход для автора ✨</h1>
    <p>Управление праздниками сайта «сегодня»</p>

    {% if error %}
      <div class="error auth-error-box" role="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin.admin_login') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="loginUsername">ЛОГИН</label>
        <input id="loginUsername" type="text" name="username" maxlength="80" required placeholder="Введите логин" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">ПАРОЛЬ АДМИНИСТРАТОРА</label>
        <input id="loginPassword" type="password" name="password" required placeholder="Введите пароль" autocomplete="current-password">
      </div>
      <button type="submit">Войти</button>
    </form>

    <div class="auth-back-wrap">
      <a href="{{ url_for('main.index') }}" class="auth-back-link">← На главную сайта</a>
    </div>
  </main>
</body>
</html>
